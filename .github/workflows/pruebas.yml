# Revisa cada propuesta de cambio (pull request) antes de unirla: corre las pruebas de tests/.
# Al unirla a main, publicar.yml las vuelve a correr y solo publica si pasan.
name: Pruebas

on:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
